<div class="contacto-interno-container">
  <div class="contacto-header">
    <h1 class="contacto-titulo">Soporte y Contacto</h1>
    <p class="contacto-subtitulo">¿Necesitas ayuda con el sistema, inventario o reservas? Envíanos tu consulta.</p>
  </div>

  <div class="contacto-card">
    <form class="contacto-form">
      <div class="form-group">
        <label class="form-label">Asunto del reporte</label>
        <input type="text" class="form-input" placeholder="Ej. Problema con una reserva o equipo dañado">
      </div>

      <div class="form-group">
        <label class="form-label">Descripción detallada</label>
        <textarea rows="5" class="form-input" placeholder="Describe tu problema aquí..."></textarea>
      </div>

      <button type="button" class="btn-enviar">Enviar mensaje</button>
    </form>
  </div>
</div>
