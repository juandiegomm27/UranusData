<header class="main-header">
  <div class="header-container">

    <button
      type="button"
      class="menu-hamburger"
      (click)="toggleSidebar()"
      title="Menú">
      <img src="icons/menu.svg" alt="Menú" class="hamburger-icon">
    </button>

    <!-- En el boceto el logo va en el sidebar; aquí lo dejamos solo en móvil -->
    <a (click)="irAlInicio()" class="logo logo-header-mobile" title="UranusData">
      <img src="logo-largo-color.svg" alt="Logo UranusData" class="logo-img">
    </a>

    <div class="header-spacer"></div>

    <div class="header-actions">

      @if (nombre || rol) {
        <div class="user-info-header">
          <span class="user-name">{{ nombre }}</span>
          <span class="user-role">{{ rol }}</span>
        </div>
      }

      <label class="switch-modo" title="Cambiar modo oscuro">
        <input
          type="checkbox"
          [checked]="modoOscuro"
          (change)="cambiarModo()"
          id="dark-mode-toggle-private">
        <span class="switch-slider"></span>
      </label>

      <!-- Donde antes estaba el avatar / panel de perfil -->
      <button
        type="button"
        class="btn-salir-header"
        (click)="salir()"
        title="Salir de sesión">
        <img src="icons/logout.svg" alt="" class="btn-salir-icon">
        <span>Salir</span>
      </button>

    </div>
  </div>
</header>
