<header class="main-header">
  <div class="header-container">

    <!-- Hamburguesa: ahora abre/cierra el sidebar, no un menú -->
    <button
      type="button"
      class="menu-hamburger"
      (click)="toggleSidebar()"
      title="Menú">
      <img src="icons/menu.svg" alt="Menú" class="hamburger-icon">
    </button>

    <!-- Logo -->
    <a (click)="irAlInicio()" class="logo" title="UranusData">
      <img src="logo-blanco-largo.svg" alt="Logo UranusData" class="logo-img">
    </a>

    <div class="header-spacer"></div>

    <!-- Acciones Derecha -->
    <div class="header-actions">

      @if (nombre || rol) {
        <div class="user-info-header">
          <span class="user-name">{{ nombre }}</span>
          <span class="user-role">{{ rol }}</span>
        </div>
      }

      <label class="switch-modo" title="Cambiar modo oscuro">
        <input
          type="checkbox"
          [checked]="modoOscuro"
          (change)="cambiarModo()"
          id="dark-mode-toggle-private">
        <span class="switch-slider"></span>
      </label>

      <app-profile-sidebar></app-profile-sidebar>

    </div>

  </div>
</header>
