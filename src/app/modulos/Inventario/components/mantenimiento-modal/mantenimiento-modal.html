@if (mostrar && elemento) {
  <div class="modal-overlay" (click)="cerrarModal()">
    <div class="modal-contenido" (click)="$event.stopPropagation()">
      
      <!-- HEADER (con color diferenciado para mantenimiento si lo deseas, o usa el por defecto) -->
      <div class="modal-header" style="background-color: #FF9F13; color: white;">
        <h2>Enviar a Mantenimiento</h2>
        <button class="btn-cerrar-modal" (click)="cerrarModal()" style="color: white;">✕</button>
      </div>

      <!-- BODY -->
      <div class="modal-body">
        
        <!-- MENSAJE ALERTA -->
        @if (mensaje) {
          <div class="mensaje-alerta" [ngClass]="'mensaje-' + tipoMensaje">
            <!--<img src="/icons/alerta.svg" alt="Alerta" class="icono-alerta">-->
            <span>{{ mensaje }}</span>
          </div>
        }

        <!-- INFORMACIÓN DEL EQUIPO -->
        <div class="seccion-info">
          <h3>Equipo a Mantenimiento</h3>
          <div class="grid-info">
            <div class="campo-info">
              <label>Elemento:</label>
              <span>{{ elemento.nombre_elemento }}</span>
            </div>
            <div class="campo-info">
              <label>ID:</label>
              <span>{{ elemento.id_elemento }}</span>
            </div>
            <div class="campo-info">
              <label>Serial:</label>
              <span>{{ elemento.serial || 'N/A' }}</span>
            </div>
            <div class="campo-info">
              <label>Ubicación Actual:</label>
              <span>{{ elemento.cod_ubi_elemento || 'N/A' }}</span>
            </div>
          </div>
        </div>

        <!-- FORMULARIO -->
        <form class="modulo-form">
          <!-- TIPO DE MANTENIMIENTO -->
          <div class="grupo-campo">
            <label for="tipo-mant">Tipo de Mantenimiento *</label>
              <select 
                id="tipo-mant"
                [(ngModel)]="cod_tipo_mantenimiento"
                name="tipo_mantenimiento">
                <option value="">Seleccionar tipo...</option>
                @for (tipo of tiposMantenimiento; track tipo.cod_tipo_mantenimiento) {
                  <option [value]="tipo.cod_tipo_mantenimiento">
                    {{ tipo.tipo_mantenimiento || tipo.tipo || tipo.nombre || tipo.descripcion }}
                  </option>
                }
              </select>
          </div>

          <!-- DESCRIPCIÓN DEL PROBLEMA -->
          <div class="grupo-campo">
            <label for="descripcion">Descripción del Problema *</label>
            <textarea 
              id="descripcion"
              [(ngModel)]="descripcion"
              name="descripcion"
              placeholder="Describe el problema o falla que presenta el elemento..."
              required></textarea>
          </div>
        </form>
      </div>

      <!-- FOOTER -->
      <div class="modal-footer">
        <button 
          class="btn-modal-primary"
          (click)="enviarMantenimiento()"
          [disabled]="cargando"
          style="background-color: #FF9F13; border-color: #FF9F13;">
          @if (cargando) {
            <span>Enviando...</span>
          } @else {
            <span>Enviar a Mantenimiento</span>
          }
        </button>
        <button 
          class="btn-modal-secondary"
          (click)="cerrarModal()"
          [disabled]="cargando">
          Cancelar
        </button>
      </div>

    </div>
  </div>
}
