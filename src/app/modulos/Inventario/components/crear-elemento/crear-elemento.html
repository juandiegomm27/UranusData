@if (mostrar) {
  <div class="modal-overlay" (click)="cerrarModal()">
    <div class="modal-contenido" (click)="$event.stopPropagation()">
      
      <!-- HEADER -->
      <div class="modal-header">
        <h2>Nuevo Elemento</h2>
        <button class="btn-cerrar-modal" (click)="cerrarModal()">✕</button>
      </div>

      <!-- BODY -->
      <div class="modal-body">
        
        <!-- MENSAJE ALERTA -->
        @if (mensaje) {
          <div class="mensaje-alerta" [ngClass]="'mensaje-' + tipoMensaje">
            <!--<img src="/icons/alerta.svg" alt="Alerta" class="icono-alerta">-->
            <span>{{ mensaje }}</span>
          </div>
        }

        <!-- FORMULARIO -->
<form class="modulo-form">
          
          <!-- FILA 1: Nombre y Código -->
          <div class="fila-formulario">
            <div class="grupo-campo">
              <label for="nombre">Nombre del Elemento *</label>
              <input id="nombre" type="text" [(ngModel)]="nombre_elemento" name="nombre" placeholder="Ej: Laptop Dell XPS">
            </div>
            <div class="grupo-campo">
              <label for="codigo">Código (Placa)</label>
              <input id="codigo" type="text" [(ngModel)]="cod_elemento" name="cod_elemento" placeholder="Dejar en blanco para autogenerar">
            </div>
          </div>

          <!-- TIPO DE ELEMENTO (Fila completa) -->
          <div class="grupo-campo">
            <label for="tipo">Tipo de Elemento *</label>
            <div class="grupo-input-flex">
              <select id="tipo" [(ngModel)]="cod_tipo_elemento" name="tipo" class="select-flex">
                <option value="">Seleccionar tipo...</option>
                @for (tipo of tipos; track tipo.cod_tipo_elemento) {
                  <option [value]="tipo.cod_tipo_elemento">{{ tipo.tipo }}</option>
                }
              </select>
              <button type="button" class="btn-accion btn-success" (click)="abrirModalTipo()" title="Agregar nuevo tipo">+</button>
              <button type="button" class="btn-accion btn-danger" (click)="eliminarTipo(+cod_tipo_elemento)" title="Eliminar tipo seleccionado">
                 <img src="icons/papelera.svg" alt="Eliminar" class="icono-btn">
              </button>
            </div>
          </div>

          <!-- UBICACIÓN (Fila completa) -->
          <div class="grupo-campo">
            <label for="ubicacion">Ubicación *</label>
            <div class="grupo-input-flex">
              <select id="ubicacion" [(ngModel)]="cod_ubi_elemento" name="ubicacion" class="select-flex">
                <option value="">Seleccionar ubicación...</option>
                @for (ubicacion of ubicaciones; track ubicacion.cod_ubi_elemento) {
                  <option [value]="ubicacion.cod_ubi_elemento">{{ ubicacion.ubicacion }}</option>
                }
              </select>
              <button type="button" class="btn-accion btn-success" (click)="abrirModalUbicacion()" title="Agregar nueva ubicación">+</button>
              <button type="button" class="btn-accion btn-danger" (click)="eliminarUbicacion(+cod_ubi_elemento)" title="Eliminar ubicación seleccionada">
                 <img src="icons/papelera.svg" alt="Eliminar" class="icono-btn">
              </button>
            </div>
          </div>

          <!-- FILA 3: Serial y Modelo -->
          <div class="fila-formulario">
            <div class="grupo-campo">
              <label for="serial">Serial/Número de Serie</label>
              <input id="serial" type="text" [(ngModel)]="serial" name="serial" placeholder="Ej: ABC123456">
            </div>
            <div class="grupo-campo">
              <label for="modelo">Modelo</label>
              <input id="modelo" type="text" [(ngModel)]="modelo" name="modelo" placeholder="Ej: XPS 15">
            </div>
          </div>

          <!-- DESCRIPCIÓN -->
          <div class="grupo-campo">
            <label for="descripcion">Descripción</label>
            <textarea id="descripcion" [(ngModel)]="descripcion" name="descripcion" placeholder="Notas adicionales sobre el elemento..."></textarea>
          </div>
        </form>

      </div>

      <!-- FOOTER -->
      <div class="modal-footer">
        <button 
          class="btn-modal-primary"
          (click)="guardar()"
          [disabled]="cargando">
          @if (cargando) {
            <span>Guardando...</span>
          } @else {
            <span>✓ Guardar</span>
          }
        </button>
        <button 
          class="btn-modal-secondary"
          (click)="cerrarModal()"
          [disabled]="cargando">
          Cancelar
        </button>
      </div>
    </div>
  </div>
}
