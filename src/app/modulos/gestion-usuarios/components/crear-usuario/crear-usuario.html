<div class="modulo-form-container">
  <div class="modulo-form-card">
    
    <div class="modulo-form-header">
      <h2>Nuevo Usuario</h2>
      <button class="btn-cerrar" (click)="volver()" title="Cerrar">✕</button>
    </div>

    <!-- Mensaje de retroalimentación -->
    @if (mensaje) {
      <div class="mensaje-alerta" [ngClass]="tipoMensaje === 'success' ? 'mensaje-success' : 'mensaje-error'">
        <span>{{ mensaje }}</span>
      </div>
    }

    <form class="modulo-form" (ngSubmit)="crearUsuario()">
      
      <!-- Fila 1: Documento y Nombre -->
      <div class="fila-formulario">
        <div class="grupo-campo">
          <label for="documento">Documento *</label>
          <input type="text" id="documento" [(ngModel)]="documento" name="documento" placeholder="Ej: 1234567890" required>
        </div>
        <div class="grupo-campo">
          <label for="nombre">Nombre *</label>
          <input type="text" id="nombre" [(ngModel)]="nombre" name="nombre" placeholder="Ej: Juan" required>
        </div>
      </div>

      <!-- Fila 2: Apellido y Teléfono -->
      <div class="fila-formulario">
        <div class="grupo-campo">
          <label for="apellido">Apellido *</label>
          <input type="text" id="apellido" [(ngModel)]="apellido" name="apellido" placeholder="Ej: López" required>
        </div>
        <div class="grupo-campo">
          <label for="telefono">Teléfono *</label>
          <input type="tel" id="telefono" [(ngModel)]="telefono" name="telefono" placeholder="Ej: 3105551234" required>
        </div>
      </div>

      <!-- Fila 3: Correo y Rol -->
      <div class="fila-formulario">
        <div class="grupo-campo">
          <label for="correo">Correo *</label>
          <input type="email" id="correo" [(ngModel)]="correo" name="correo" placeholder="Ej: usuario@example.com" required>
        </div>
        <div class="grupo-campo">
          <label for="rol">Rol *</label>
          <select id="rol" [(ngModel)]="cod_rol" name="cod_rol" required>
            @for (item of rol; track item.cod_rol) {
              <option [value]="item.cod_rol">{{ item.cargo }}</option>
            }
          </select>
        </div>
      </div>

      <!-- Botones de acción alineados a la derecha -->
      <div class="modulo-botones-accion">
        <button type="button" class="btn-limpiar" (click)="limpiarFormulario()" [disabled]="cargando">
          Limpiar
        </button>
        <button type="button" class="btn-cancelar" (click)="volver()" [disabled]="cargando">
          Cancelar
        </button>
        <button type="submit" class="btn-guardar" [disabled]="cargando">
          @if (cargando) {
            <span>Creando...</span>
          } @else {
            <span>✓ Crear Usuario</span>
          }
        </button>
      </div>

    </form>
  </div>
</div>
