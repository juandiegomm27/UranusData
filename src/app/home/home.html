<!-- Home solo decide qué panel mostrar según el rol -->
@if (rolUsuario() === 'Gerente' || rolUsuario() === 'Tecnico') {
  <app-dashboard-resumen></app-dashboard-resumen>
} @else if (rolUsuario() === 'Docente') {
  <app-docente></app-docente>
} @else {
  <div style="padding: 40px; text-align: center; color: #666;">
    <h2>Cargando panel de control...</h2>
    <p>Verificando permisos de rol: {{ rolUsuario() }}</p>
  </div>
}
