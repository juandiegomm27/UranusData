server:
  port: 8000
  servlet:
    context-path: /api

spring:
  application:
    name: uranusdata
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:uranusdata}
    username: ${DB_USERNAME:uranusdata_user}
    password: ${DB_PASSWORD:uranusdata_password}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:2525}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}

app:
  frontend-url: ${FRONTEND_URL:http://localhost:4200}
  cors-origins: ${CORS_ORIGINS:http://localhost:4200,http://127.0.0.1:4200}
  mail-from: ${MAIL_FROM_ADDRESS:noreply@uranusdata.local}
  mail-soporte: ${MAIL_SOPORTE_ADDRESS:soporte@uranusdata.local}
  jwt:
    secret: ${JWT_SECRET:cambia-este-secreto-por-uno-de-minimo-32-bytes-aleatorios}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}