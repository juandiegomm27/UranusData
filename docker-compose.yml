services:
  # 1. BASE DE DATOS (POSTGRESQL)
  postgres:
    image: postgres:17-alpine
    container_name: uranusdata-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-uranusdata}
      POSTGRES_USER: ${POSTGRES_USER:-uranusdata_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-uranusdata_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - uranusdata

  # 1.1 BACKEND (SPRING BOOT)
  spring-backend:
    build:
      context: ./spring-backend
    container_name: uranusdata-spring
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-uranusdata}
      DB_USERNAME: ${POSTGRES_USER:-uranusdata_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-uranusdata_password}
      JWT_SECRET: ${JWT_SECRET:-cambia-este-secreto-por-uno-de-minimo-32-bytes-aleatorios}
      FRONTEND_URL: http://localhost:4200
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    networks:
      - uranusdata

  mailpit:
    image: axllent/mailpit:v1.34.0
    container_name: uranusdata-mailpit
    ports:
      - "2525:1025"
      - "8025:8025"
    networks:
      - uranusdata

  # 2. FRONTEND (ANGULAR)
  frontend:
    build:
      context: .
    container_name: uranusdata-frontend
    volumes:
      - ./:/app
      - /app/node_modules
      - /app/laravel-backend
      - /app/spring-backend
    ports:
      - "4200:4200"
    networks:
      - uranusdata

  # 3. PGADMIN (POSTGRSQL)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: uranusdata-pgadmin
    profiles: ["tools"]
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@uranusdata.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - uranusdata

  # 4. LEGACY 
  backend:
    build:
      context: ./laravel-backend
    container_name: uranusdata-backend
    profiles: ["legacy"]
    volumes:
      - ./laravel-backend:/app
      - backend_vendor:/app/vendor
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=mysql
      - DB_DATABASE=uranusdata
      - DB_USERNAME=uranusdata_user
      - DB_PASSWORD=uranusdata_password
      - PHP_CLI_SERVER_WORKERS=4
    depends_on:
      - mysql
    networks:
      - uranusdata

  mysql:
    image: mysql:8.0
    container_name: uranusdata-mysql
    profiles: ["legacy"]
    command: --skip-name-resolve
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: uranusdata
      MYSQL_USER: uranusdata_user
      MYSQL_PASSWORD: uranusdata_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - uranusdata

volumes:
  postgres_data:
  mysql_data:
  backend_vendor:

networks:
  uranusdata:
    driver: bridge